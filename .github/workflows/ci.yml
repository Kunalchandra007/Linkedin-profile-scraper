name: CI

# Runs lint + the offline test suite. The suite uses PROVIDER=fixture and never
# contacts LinkedIn (no credentials, no network), so it is safe in CI. Playwright
# is intentionally NOT installed here — the core app and tests don't need it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        env:
          PROVIDER: fixture
          API_KEY: ci-test-key
        run: pytest
