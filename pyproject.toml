[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linkedin-profile-api"
version = "0.1.0"
description = "Hosted HTTPS API returning structured JSON for a LinkedIn profile URL, built on a pluggable provider architecture (mock/fixture by default; optional browser-automation scraper)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kunal Chandra" }]
keywords = ["fastapi", "scraping", "linkedin", "api", "playwright"]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
# Only needed when PROVIDER=linkedin. Kept optional so the core app never
# requires a browser engine. (beautifulsoup4 also lives in dev so parser tests
# can run in CI without Playwright.)
scraper = [
    "playwright>=1.42",
    "beautifulsoup4>=4.12",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
    "beautifulsoup4>=4.12",
    "ruff>=0.4",
]

[project.scripts]
linkedin-api = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ─── Ruff (lint + import sort + format) ───
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["session", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
# B008: FastAPI idiomatically calls Depends()/Query() in argument defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

# ─── Pytest ───
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
